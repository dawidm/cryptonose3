[workspace]
resolver = "2"
members = ["crates/cn-core", "crates/cn-exchanges", "crates/cn-cli", "app/src-tauri"]

[workspace.package]
version = "3.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
cn-core = { path = "crates/cn-core" }
cn-exchanges = { path = "crates/cn-exchanges" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
